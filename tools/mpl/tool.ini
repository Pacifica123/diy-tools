[tool]
id = mpl
name_ru = Mermaid Processor Lite
name_en = Mermaid Processor Lite
version = 0.1.2
status = draft
category = diagrams
language = python
maturity = M2
flags = G
short_ru = Лёгкий локальный процессор Mermaid-subset: парсит текст, строит AST JSON и рисует SVG-превью через Qt GUI.

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.1-devctl

[interfaces]
core = yes
api = yes
abi = json_contract
cli = yes
gui = yes_qt
apk = no
web_localhost = no
primary = gui
secondary = cli/api/abi

[support]
windows = expected
linux = expected
android_apk = unsupported
android_termux = unsupported
macos = unknown

[run]
windows = run.bat
linux = ./run.sh
cli = python main.py --cli --help
gui = python main.py
api = from mpl.api import process_text

[deps]
python = >=3.11
pip = PySide6>=6.6 for GUI; core/api/abi/cli use stdlib only
external = none
node = none
rust = none

[safety]
dangerous = false
network = false
overwrites_files = false
deletes_files = false
runs_external_commands = false
handles_private_files = possible
dry_run = not_needed
backup = not_needed
report = stdout/gui

[data]
input_contract = README.md#вход
output_contract = README.md#выход
state_dir = none
config_location = capsule
logs_contain_private_data = possible

[checks]
smoke = python scripts/smoke_test.py
manual = Установить PySide6, запустить python main.py, вставить пример Mermaid и нажать Отрисовать.

[notes]
short = Это не полный Mermaid-движок. Версия 0.1.2 улучшает читаемость SVG: контрастная тема, ортогональные линии, fan-out spacing и явный z-order.
