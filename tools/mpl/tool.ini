[tool]
id = mpl
name_ru = Mermaid Processor Lite
name_en = Mermaid Processor Lite
version = 0.2.0
status = tested
category = diagrams
language = python
maturity = M3
flags = G
short_ru = Лёгкий локальный процессор Mermaid-subset: парсит текст, строит AST JSON и рисует SVG-превью через Qt GUI.
changelog = CHANGELOG.md

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.2-devctl

[interfaces]
core = yes
api = yes
abi = json_contract
cli = yes
gui = yes_qt
apk = no
web_localhost = no
primary = gui
secondary = cli/api/abi

[support]
windows = expected
linux = tested
android_apk = unsupported
android_termux = unsupported
macos = unknown

[run]
windows = run.bat
linux = ./run.sh
cli = python main.py --cli --help
gui = python main.py
api = from mpl.api import process_text

[deps]
python = >=3.11
pip = PySide6>=6.6 for GUI; core/api/abi/cli use stdlib only
external = none
node = none
rust = none

[safety]
dangerous = false
network = false
overwrites_files = false
deletes_files = false
runs_external_commands = false
handles_private_files = possible
dry_run = not_needed
backup = not_needed
report = stdout/gui

[data]
input_contract = docs/ABI.md#вход
output_contract = docs/ABI.md#выход
contract_doc = docs/CONTRACT.md
contract_version = 1
state_dir = none
config_location = capsule
logs_contain_private_data = possible

[checks]
smoke = python scripts/smoke_test.py
regression = examples/output_expected
tested_scope = Smoke на Linux прогоняет core/API/ABI/CLI и run.sh на всех examples/input и сравнивает AST JSON и SVG целиком с examples/output_expected, плюс ошибки и коды возврата; Qt GUI, run.bat и Windows автоматически не проверяются.
manual = Установить PySide6, запустить python main.py, вставить пример Mermaid и нажать Отрисовать.

[notes]
short = Это не полный Mermaid-движок, раскладка best-effort. Top-level subgraph раскладываются как отдельные блоки, обратные стрелки идут короткой ломаной. Если меняется раскладка — пересоздай examples/output_expected (команда в README) и запиши это в CHANGELOG.
