[tool]
id = random_wheel_app
name_ru = Колесо рандома
name_en = Random Wheel App
version = 0.1.0
status = working
category = decision
language = python
maturity = M2
flags = I
short_ru = GUI-колесо случайного выбора с равным/взвешенным режимом, seed, autosave и экспортом истории.

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.1-devctl

[interfaces]
core = yes
api = internal
abi = simple_files
cli = no
gui = yes
apk = no
web_localhost = no
primary = gui
secondary = smoke_test

[support]
windows = expected
linux = expected
android_apk = unsupported
android_termux = unsupported
macos = unknown

[run]
windows = run.bat
linux = sh run.sh
cli = python scripts/smoke_test.py
gui = python main.py
api = app.domain

[deps]
python = >=3.11
pip = PySide6>=6.7
external = none
node = none
rust = none

[safety]
dangerous = false
network = false
overwrites_files = possible
deletes_files = false
runs_external_commands = false
handles_private_files = possible
dry_run = not_needed
backup = not_needed
report = gui_history_export

[data]
input_contract = docs/input_format.md
output_contract = README.md#выход
state_dir = local_autosave
config_location = capsule
logs_contain_private_data = possible

[checks]
smoke = python scripts/smoke_test.py
manual = Запустить GUI, импортировать examples/sample_weighted.txt, выполнить один spin и экспортировать историю.

[notes]
short = Флаг I: есть random seed, autosave, история и экспорт.
