[tool]
id = video_converter
name_ru = Конвертер MKV в MP4
name_en = Video Converter
version = 0.3.0
status = tested
category = media
language = python
maturity = M3
flags = D,P
short_ru = Безопасно конвертирует .mkv в .mp4 через ffmpeg; удаление оригиналов только по явному флагу.
changelog = CHANGELOG.md

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.2-devctl

[interfaces]
core = yes
api = no
abi = cli_json_report
cli = yes
gui = no
apk = no
web_localhost = no
primary = cli
secondary = json_report

[support]
windows = expected
linux = tested
android_apk = unsupported
android_termux = unknown
macos = unknown

[run]
windows = run.bat
linux = sh run.sh
cli = python src/cli.py --help
gui = none
api = none

[deps]
python = >=3.11
pip = none
external = ffmpeg
node = none
rust = none

[safety]
dangerous = true
network = false
overwrites_files = possible
deletes_files = optional_explicit
runs_external_commands = true
handles_private_files = true
dry_run = yes
backup = external_user_responsibility
report = json_optional_stdout_summary

[data]
input_contract = docs/CONTRACT.md#вход
output_contract = docs/CONTRACT.md#выход
contract_doc = docs/CONTRACT.md
contract_version = 1
state_dir = none
config_location = cli_args
logs_contain_private_data = true

[checks]
smoke = python scripts/smoke_test.py
manual = python src/cli.py ./examples/input --recursive --dry-run
regression = examples/output_expected
tested_scope = Автоматически на Linux проверяются dry-run и JSON-отчёт на examples/input, пропуск существующих mp4, --overwrite, --delete-originals и ошибки ffmpeg на копии с заглушкой ffmpeg, запуск через run.sh и (если ffmpeg установлен) настоящая конвертация односекундного синтетического ролика; не проверяются Windows и run.bat, большие и реальные пользовательские файлы, качество перекодировки.

[notes]
short = Исходный M0-скрипт был переписан: убран hardcoded path, удаление исходников вынесено в --delete-originals.
