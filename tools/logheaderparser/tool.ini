[tool]
id = logheaderparser
name_ru = Потоковый парсер шаблонов логов
name_en = Log Header Parser
version = 0.2.0
status = working
category = logs
language = rust
maturity = M3
flags = S,P
short_ru = Потоково группирует большие лог-файлы в похожие шаблоны и пишет JSON-report.
changelog = CHANGELOG.md

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.2-devctl

[interfaces]
core = embedded
api = no
abi = json_report
cli = yes
gui = no
apk = no
web_localhost = no
primary = cli
secondary = json_report

[support]
windows = expected
linux = expected
android_apk = unsupported
android_termux = unknown
macos = unknown

[run]
windows = run.bat
linux = sh run.sh
cli = cargo run -- examples/input/sample.log --json report.json --progress-lines 0
gui = none
api = none

[deps]
python = none
pip = none
external = none
node = none
rust = stable cargo

[safety]
dangerous = false
network = false
overwrites_files = possible
deletes_files = false
runs_external_commands = false
handles_private_files = true
dry_run = not_needed
backup = not_needed
report = json

[data]
input_contract = docs/CONTRACT.md#вход
output_contract = docs/CONTRACT.md#json-отчёт
contract_doc = docs/CONTRACT.md
contract_version = 1
state_dir = none
config_location = cli_args
logs_contain_private_data = true

[checks]
smoke = python scripts/smoke_test.py
manual = cargo run -- examples/input/sample.log --json report.json --progress-lines 0
regression = examples/output_expected
tested_scope = При наличии cargo smoke собирает инструмент во временный каталог и сравнивает JSON-отчёты трёх прогонов на examples/input с эталонами (обычный режим, лимит шаблонов, --examples 0), проверяет прогресс в stderr и ошибку отсутствующего файла. Автор версии 0.2.0 собрать Rust-код не мог (не было доступа к crates.io), эталоны выведены из алгоритма: первая настоящая сборка и сверка происходят у владельца при применении патча. Windows, run.bat и большие логи не проверялись.

[notes]
short = Флаги S/P: потоковое чтение больших логов; report может содержать приватные строки. status = working и linux = expected до первой зелёной сборки у владельца.
