[tool]
id = logheaderparser
name_ru = Потоковый парсер шаблонов логов
name_en = Log Header Parser
version = 0.1.0
status = draft
category = logs
language = rust
maturity = M2
flags = S,P
short_ru = Потоково группирует большие лог-файлы в похожие шаблоны и пишет JSON-report.

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.1-devctl

[interfaces]
core = embedded
api = no
abi = json_report
cli = yes
gui = no
apk = no
web_localhost = no
primary = cli
secondary = json_report

[support]
windows = expected
linux = expected
android_apk = unsupported
android_termux = unknown
macos = unknown

[run]
windows = run.bat
linux = sh run.sh
cli = cargo run -- examples/sample.log --json report.json --progress-lines 0
gui = none
api = none

[deps]
python = none
pip = none
external = none
node = none
rust = stable cargo

[safety]
dangerous = false
network = false
overwrites_files = possible
deletes_files = false
runs_external_commands = false
handles_private_files = true
dry_run = not_needed
backup = not_needed
report = json

[data]
input_contract = README.md#вход
output_contract = README.md#выход
state_dir = none
config_location = cli_args
logs_contain_private_data = true

[checks]
smoke = python scripts/smoke_test.py
manual = cargo run -- examples/sample.log --json report.json --progress-lines 0

[notes]
short = Флаги S/P: потоковое чтение больших логов; report может содержать приватные строки.
