[tool]
id = zapret_strategy_extractor
name_ru = Извлекатель zapret-стратегий
name_en = Zapret Strategy Extractor
version = 0.2.0
status = working
category = logs
language = rust
maturity = M3
flags = S,G,P
short_ru = Потоково извлекает LOCK/SUCCESS zapret-стратегии из orchestra-логов и генерирует best-effort preset с audit output.
changelog = CHANGELOG.md

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.2-devctl

[interfaces]
core = embedded
api = no
abi = generated_files
cli = yes
gui = no
apk = no
web_localhost = no
primary = cli
secondary = audit_files

[support]
windows = expected
linux = expected
android_apk = unsupported
android_termux = unknown
macos = unknown

[run]
windows = run.bat
linux = sh run.sh
cli = cargo run -- "examples/input/orchestra сессия.log" --preset-out preset.txt --stats-out stats.json --events-out events.tsv --progress-lines 0
gui = none
api = none

[deps]
python = none
pip = none
external = none
node = none
rust = stable cargo

[safety]
dangerous = false
network = false
overwrites_files = possible
deletes_files = false
runs_external_commands = false
handles_private_files = true
dry_run = not_needed
backup = not_needed
report = stats_json_events_tsv

[data]
input_contract = docs/CONTRACT.md#вход
output_contract = docs/CONTRACT.md#выход
contract_doc = docs/CONTRACT.md
contract_version = 1
state_dir = none
config_location = cli_args
logs_contain_private_data = true

[checks]
smoke = python scripts/smoke_test.py
manual = cargo run -- "examples/input/orchestra сессия.log" --preset-out preset.txt --stats-out stats.json --events-out events.tsv --progress-lines 0
regression = examples/output_expected
tested_scope = При наличии cargo smoke собирает инструмент во временный каталог и сравнивает preset, stats.json и events.tsv трёх прогонов на examples/input с эталонами (обычный режим, --base-preset с ограничениями, старый короткий пример), проверяет прогресс в stderr, имена файлов по умолчанию, неизменность входов и ошибку отсутствующего лога. Автор версии 0.2.0 собрать Rust-код не мог (не было доступа к crates.io), эталоны выведены из алгоритма: первая настоящая сборка и сверка происходят у владельца при применении патча. Примеры логов синтетические, построены по шаблонам строк из парсера; на настоящем orchestra-логе, Windows и больших файлах версия не проверялась.

[notes]
short = Флаг G: generated preset обязательно проверять вручную перед применением. status = working и linux = expected до первой зелёной сборки у владельца.
