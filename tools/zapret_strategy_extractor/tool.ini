[tool]
id = zapret_strategy_extractor
name_ru = Извлекатель zapret-стратегий
name_en = Zapret Strategy Extractor
version = 0.1.0
status = draft
category = logs
language = rust
maturity = M2
flags = S,G,P
short_ru = Потоково извлекает LOCK/SUCCESS zapret-стратегии из orchestra-логов и генерирует best-effort preset с audit output.

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.1-devctl

[interfaces]
core = embedded
api = no
abi = generated_files
cli = yes
gui = no
apk = no
web_localhost = no
primary = cli
secondary = audit_files

[support]
windows = expected
linux = expected
android_apk = unsupported
android_termux = unknown
macos = unknown

[run]
windows = run.bat
linux = sh run.sh
cli = cargo run -- examples/sample_orchestra.log --preset-out preset.txt --stats-out stats.json --events-out events.tsv --progress-lines 0
gui = none
api = none

[deps]
python = none
pip = none
external = none
node = none
rust = stable cargo

[safety]
dangerous = false
network = false
overwrites_files = possible
deletes_files = false
runs_external_commands = false
handles_private_files = true
dry_run = not_needed
backup = not_needed
report = stats_json_events_tsv

[data]
input_contract = README.md#вход
output_contract = README.md#выход
state_dir = none
config_location = cli_args
logs_contain_private_data = true

[checks]
smoke = python scripts/smoke_test.py
manual = cargo run -- examples/sample_orchestra.log --preset-out preset.txt --stats-out stats.json --events-out events.tsv --progress-lines 0

[notes]
short = Флаг G: generated preset обязательно проверять вручную перед применением.
