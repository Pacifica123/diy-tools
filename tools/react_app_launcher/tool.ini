[tool]
id = react_app_launcher
name_ru = Лаунчер приложений и профилей
name_en = React App Launcher
version = 0.2.2
status = working
category = desktop
language = node-electron
maturity = M2
flags = O,P
short_ru = Electron GUI для запуска профилей приложений, папок, файлов, URL и команд.

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.1-devctl

[interfaces]
core = partial
api = ipc
abi = user_config_json
cli = npm_scripts
gui = yes
apk = no
web_localhost = local_dev_only
primary = gui
secondary = npm_scripts

[support]
windows = expected
linux = unknown
android_apk = unsupported
android_termux = unsupported
macos = unknown

[run]
windows = npm run dev
linux = npm run dev
cli = npm run build
gui = npm run dev
api = electron ipc

[deps]
python = none
pip = none
external = user_selected_programs
node = >=20 + npm install
rust = none

[safety]
dangerous = false
network = possible_user_urls
overwrites_files = possible
deletes_files = false
runs_external_commands = true
handles_private_files = true
dry_run = path_validation
backup = not_needed
report = gui_launch_log

[data]
input_contract = README.md#вход
output_contract = README.md#выход
state_dir = electron_userData
config_location = user_config
logs_contain_private_data = possible

[checks]
smoke = node scripts/smoke_test.js
manual = npm install; npm run dev; проверить packaged mode перед релизом

[notes]
short = Флаг O: command запускается без shell по умолчанию; raw shell требует allowShell=true в JSON.
