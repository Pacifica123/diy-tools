[tool]
id = react_app_launcher
name_ru = StartDeck — лаунчер профилей запуска
name_en = StartDeck
version = 0.4.0
status = working
category = desktop
language = node-electron
maturity = M3
flags = O,P
changelog = CHANGELOG.md
short_ru = Electron GUI для запуска профилей приложений, папок, файлов, URL и команд.

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.2-devctl

[interfaces]
core = yes
api = ipc
abi = user_config_json
cli = npm_scripts
gui = yes
apk = no
web_localhost = local_dev_only
primary = gui
secondary = npm_scripts

[support]
windows = expected
linux = unknown
android_apk = unsupported
android_termux = unsupported
macos = unknown

[run]
windows = npm run dev
linux = npm run dev
cli = node scripts/dry_run.js --help
gui = npm run dev
api = electron ipc

[deps]
python = none
pip = none
external = user_selected_programs
node = >=20 + npm install
rust = none

[safety]
dangerous = false
network = possible_user_urls
overwrites_files = possible
deletes_files = false
runs_external_commands = true
handles_private_files = true
dry_run = yes
backup = not_needed
report = gui_launch_log + dry_run_json_stdout

[data]
input_contract = docs/CONTRACT.md#формат-конфига-профилей
output_contract = docs/CONTRACT.md#отчёт-пробного-прогона
contract_doc = docs/CONTRACT.md
contract_version = 1
state_dir = electron_userData
config_location = user_config
logs_contain_private_data = possible

[checks]
smoke = node scripts/smoke_test.js
manual = npm install; npm run dev; npm run dist:win перед релизом
regression = examples/output_expected
tested_scope = Автоматически на Linux без npm install: ядро запуска electron/launch_core.cjs, scripts/dry_run.js и обработчики electron/main.cjs с заглушками Electron и child_process на трёх примерах из examples/input сравниваются с эталоном (проверка путей, типы, allowShell, аргументы, URL, старые формы конфига); настоящее окно Electron/React, реальный запуск программ, safeStorage, npm run dev, сборка portable EXE и Windows не запускались.

[notes]
short = Публичное имя StartDeck. Технический id сохранён как react_app_launcher для совместимости с общей полкой. Журнал запусков живёт только в окне и на диск не пишется; status = working: ядро запуска проверяется автоматически, но окно Electron после переноса логики в ядро не запускалось (см. tested_scope).
