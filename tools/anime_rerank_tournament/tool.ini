[tool]
id = anime_rerank_tournament
name_ru = Турнир переоценки аниме
name_en = Anime Rerank Tournament
version = 0.2.0
status = tested
category = ranking
language = python
maturity = M3
flags = I
short_ru = GUI-турнир для ручной переоценки аниме-списка с autosave, undo, scoring rules и экспортом.
changelog = CHANGELOG.md

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.2-devctl

[interfaces]
core = yes
api = internal
abi = simple_files
cli = no
gui = yes
apk = no
web_localhost = no
primary = gui
secondary = smoke_test

[support]
windows = expected
linux = tested
android_apk = unsupported
android_termux = unsupported
macos = unknown

[run]
windows = run.bat
linux = sh run.sh
cli = python scripts/smoke_test.py
gui = python main.py
api = app.domain

[deps]
python = >=3.11
pip = PySide6>=6.6
external = none
node = none
rust = none

[safety]
dangerous = false
network = false
overwrites_files = possible
deletes_files = false
runs_external_commands = false
handles_private_files = possible
dry_run = not_needed
backup = not_needed
report = gui_export

[data]
input_contract = docs/input_format.md
output_contract = docs/CONTRACT.md#экспорт
contract_doc = docs/CONTRACT.md
contract_version = 1
state_dir = ~/.anime_rerank_tournament
config_location = capsule
logs_contain_private_data = possible

[checks]
smoke = python scripts/smoke_test.py
regression = examples/output_expected
tested_scope = Автоматически на Linux (Python 3.11–3.13) проверены слои app/domain, app/storage и app/utils: разбор TXT, сценарные сессии с выбором, отменой, autosave и загрузкой сохранений, рейтинг, оба режима оценивания, экспорт; окна PySide6 (app/ui) и Windows не проверялись.
manual = Запустить GUI, импортировать examples/input/sample_input.txt, сделать 2-3 выбора, проверить undo/autosave/export.

[notes]
short = Флаг I: subjective ranking требует autosave, undo/history и объяснимых scoring rules. Статус tested относится к доменному слою и хранению на Linux; GUI проверяется вручную.
