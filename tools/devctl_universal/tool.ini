[tool]
id = devctl_universal
name_ru = Devctl universal
name_en = Devctl Universal
version = 0.6.7-cli-0.2.2-gui
status = working
category = tooling
language = python
maturity = M3
flags = D,O,P,G
short_ru = Конвейер применения devctl-патчей с CLI и Tkinter GUI: plan/start/checks/commit/archive/UserTestSpace.

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.1-devctl

[interfaces]
core = yes
api = child_json
abi = patch_zip_manifest
cli = yes
gui = yes
apk = no
web_localhost = no
primary = cli
secondary = gui

[support]
windows = expected
linux = expected
android_apk = unsupported
android_termux = unknown
macos = unknown

[run]
windows = run.bat --version
linux = sh run.sh --version
cli = python devctl.py --version
gui = python gui/devctl_gui.py
api = python devctl.py status --json

[deps]
python = >=3.11
pip = none
external = git
node = none
rust = none

[safety]
dangerous = true
network = possible_git_push
overwrites_files = true
deletes_files = true
runs_external_commands = true
handles_private_files = true
dry_run = plan
backup = archives_and_failed_snapshots
report = archives_reports

[data]
input_contract = docs/patch-manifest.example.json
output_contract = README.md#выход
state_dir = workspace_dot_devctl
config_location = workspace_config
logs_contain_private_data = possible

[checks]
smoke = python scripts/smoke_test.py
manual = Создать тестовый workspace, положить безопасный patch.zip, выполнить plan и start --no-push.

[notes]
short = GUI-архив использован как superset CLI+GUI; отдельный CLI-архив не дублируется как отдельная капсула.
