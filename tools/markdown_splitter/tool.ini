[tool]
id = markdown_splitter
name_ru = Нарезчик Markdown
name_en = Markdown Splitter
version = 0.3.0
status = tested
category = text
language = python
maturity = M3
flags = P,G
short_ru = Делит большие Markdown-файлы на самостоятельные части, сохраняя структурные блоки и контекстные заголовки.
changelog = CHANGELOG.md

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.2-devctl

[interfaces]
core = yes
api = no
abi = cli_json_report
cli = yes
gui = no
apk = no
web_localhost = no
primary = cli
secondary = json_report

[support]
windows = expected
linux = tested
android_apk = unsupported
android_termux = unknown
macos = unknown

[run]
windows = run.bat
linux = sh run.sh
cli = python src/cli.py --help
gui = none
api = none

[deps]
python = >=3.11
pip = none
external = none
node = none
rust = none

[safety]
dangerous = false
network = false
overwrites_files = false
deletes_files = false
runs_external_commands = false
handles_private_files = true
dry_run = yes
backup = not_needed
report = stdout/index.json

[data]
input_contract = docs/CONTRACT.md#вход
output_contract = docs/CONTRACT.md#выход
contract_doc = docs/CONTRACT.md
contract_version = 1
state_dir = none
config_location = cli_args
logs_contain_private_data = possible_filename_and_heading_titles

[checks]
smoke = python scripts/smoke_test.py
manual = python src/cli.py examples/input/sample.md --max-size 200 --dry-run
regression = examples/output_expected
tested_scope = Автоматически на Linux: пять примеров из examples/input сравниваются с эталоном, проверяются инварианты нарезки, CRLF+BOM, dry-run, защита от перезаписи, ошибки входа и run.sh; Windows и run.bat не запускались, файлы больше нескольких килобайт и редкие конструкции CommonMark не проверяются.

[notes]
short = Лимит мягкий: неделимый Markdown-блок не режется посередине и может сделать отдельную часть больше max-size.
