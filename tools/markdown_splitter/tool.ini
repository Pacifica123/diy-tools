[tool]
id = markdown_splitter
name_ru = Нарезчик Markdown
name_en = Markdown Splitter
version = 0.2.0
status = draft
category = text
language = python
maturity = M2
flags = P,G
short_ru = Делит большие Markdown-файлы на самостоятельные части, сохраняя структурные блоки и контекстные заголовки.

[philosophy]
diy = true
copyable_capsule = true
modifiable = true
rewrite_friendly = true
standard_version = 0.1-devctl

[interfaces]
core = yes
api = no
abi = cli_json_report
cli = yes
gui = no
apk = no
web_localhost = no
primary = cli
secondary = json_report

[support]
windows = expected
linux = expected
android_apk = unsupported
android_termux = unknown
macos = unknown

[run]
windows = run.bat
linux = sh run.sh
cli = python src/cli.py --help
gui = none
api = none

[deps]
python = >=3.11
pip = none
external = none
node = none
rust = none

[safety]
dangerous = false
network = false
overwrites_files = false
deletes_files = false
runs_external_commands = false
handles_private_files = true
dry_run = yes
backup = not_needed
report = stdout/index.json

[data]
input_contract = README.md#вход
output_contract = README.md#выход
state_dir = none
config_location = cli_args
logs_contain_private_data = possible_filename_only

[checks]
smoke = python scripts/smoke_test.py
manual = python src/cli.py examples/sample.md --max-size 500 --dry-run

[notes]
short = Лимит мягкий: неделимый Markdown-блок не режется посередине и может сделать отдельную часть больше max-size.
